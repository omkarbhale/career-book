<text x="620.0" y="94.0" class="t t-sm t-end t-mute">most of your working relationships,</text>
<text x="620.0" y="116.0" class="t t-sm t-end t-mute">and that&#x27;s fine</text>
<text x="620.0" y="326.0" class="t t-sm t-end t-a2">a few people: where the</text>
<text x="620.0" y="348.0" class="t t-sm t-end t-a2">rules start to collide</text>
<path d="M70.0 118.0 Q68.5 285.8 69.6 456.6" class="k-thick k-mute"/>
<circle cx="70" cy="118" r="20" class="f-soft k"/>
<text x="112.0" y="108.0" class="t t-bold">colleague</text>
<text x="112.0" y="136.0" class="t t-sm">runs on the work</text>
<text x="112.0" y="160.0" class="t t-sm t-mute">talk: tasks</text>
<circle cx="70" cy="222" r="20" class="f-a3 k"/>
<text x="112.0" y="212.0" class="t t-bold">friendly colleague</text>
<text x="112.0" y="240.0" class="t t-sm">runs on warmth</text>
<text x="112.0" y="264.0" class="t t-sm t-mute">talk: weekends, the coffee machine</text>
<circle cx="70" cy="352" r="20" class="f-a2 k"/>
<text x="112.0" y="342.0" class="t t-bold">work friend</text>
<text x="112.0" y="370.0" class="t t-sm">runs on trust</text>
<text x="112.0" y="394.0" class="t t-sm t-mute">talk: how it&#x27;s really going</text>
<circle cx="70" cy="456" r="20" class="f-a2s k"/>
<text x="112.0" y="446.0" class="t t-bold">friend</text>
<text x="112.0" y="474.0" class="t t-sm">runs on life</text>
<text x="112.0" y="498.0" class="t t-sm t-mute">would stay friends if one of you left</text>
