<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 530" class="fig">
<title>Four kinds of work relationship</title>
<style>
/* Figure vocabulary. Every figure's style element is an exact copy of this file
   (python3 tools/build.py --sync-figure-style). Colours come from theme tokens;
   the fallbacks are the light theme, used when a figure is opened on its own. */
.fig { font-family: var(--font-hand, "Caveat", "Segoe Print", "Comic Sans MS", cursive); }
