<path d="M60.0 412.0 Q318.5 411.6 580.0 412.5" class="k-thin k-mute"/>
<text x="64.0" y="446.0" class="t t-bold">balance: what people will vouch for</text>
<text x="320.0" y="506.0" class="t t-sm t-mid t-mute">One withdrawal can cancel several deposits.</text><text x="320.0" y="532.0" class="t t-sm t-mid t-mute">Illustrative weights, not a formula.</text>
