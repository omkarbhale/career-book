<text x="531.0" y="60.0" class="t t-sans t-mid">weight</text>
<text x="64.0" y="118.0" class="t t-lg t-bold t-a2">+</text>
<text x="96.0" y="118.0" class="t">did the boring fix nobody asked for</text>
<rect x="519.0" y="96" width="24" height="26" rx="5" class="f-a2s"/>
<text x="64.0" y="170.0" class="t t-lg t-bold t-a2">+</text>
<text x="96.0" y="170.0" class="t">kept a small promise, on time</text>
<rect x="519.0" y="148" width="24" height="26" rx="5" class="f-a2s"/>
<text x="64.0" y="222.0" class="t t-lg t-bold t-a2">+</text>
<text x="96.0" y="222.0" class="t">credited Kai by name in stand-up</text>
<rect x="519.0" y="200" width="24" height="26" rx="5" class="f-a2s"/>
<text x="64.0" y="274.0" class="t t-lg t-bold t-a1">−</text>
<text x="96.0" y="274.0" class="t">snapped at someone in a review</text>
<rect x="495.0" y="252" width="72" height="26" rx="5" class="f-a1s"/>
<text x="64.0" y="326.0" class="t t-lg t-bold t-a2">+</text>
<text x="96.0" y="326.0" class="t">warned early that a task would slip</text>
<rect x="519.0" y="304" width="24" height="26" rx="5" class="f-a2s"/>
<text x="64.0" y="378.0" class="t t-lg t-bold t-a2">+</text>
<text x="96.0" y="378.0" class="t">admitted a mistake before anyone found it</text>
