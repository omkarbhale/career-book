<text x="24.0" y="40.0" class="t t-sans">Inbound applicants (one vendor’s data, 2024)</text>
<path d="M40.0 64 L600.0 64 L535.0 120 L105.0 120 Z" class="f-a1"/>
<path d="M40.0 64.0 Q318.4 62.8 599.9 64.2" class="k-thin"/>
<text x="320.0" y="100.0" class="t t-mid">1,000 apply</text>
<path d="M105.0 124 L535.0 124 L470.0 180 L170.0 180 Z" class="f-a1"/>
<path d="M105.0 124.0 Q318.8 122.8 534.7 124.3" class="k-thin"/>
<text x="320.0" y="160.0" class="t t-mid">about 60 get a first screen</text>
<text x="549.0" y="134.0" class="t t-sm t-a1">6%</text>
<path d="M170.0 184 L470.0 184 L410.0 240 L230.0 240 Z" class="f-a1"/>
<path d="M170.0 184.0 Q318.9 184.8 470.2 183.5" class="k-thin"/>
<text x="320.0" y="220.0" class="t t-mid">about 12 reach the final round</text>
<text x="484.0" y="194.0" class="t t-sm t-a1">20% of those</text>
<path d="M230.0 244 L410.0 244 L375.0 300 L265.0 300 Z" class="f-a1"/>
<path d="M230.0 244.0 Q320.1 243.8 409.9 244.6" class="k-thin"/>
<text x="320.0" y="280.0" class="t t-mid">about 4 get an offer</text>
<text x="424.0" y="254.0" class="t t-sm t-a1">35% of those</text>
<path d="M265 300 L375 300" class="k-thin"/>
<text x="320.0" y="330.0" class="t t-sm t-mid t-mute">0.4% hired. Not to scale.</text>
<path d="M24.0 356.0 Q318.7 354.5 616.6 355.9" class="k-thin k-dash k-mute"/>
<text x="24.0" y="396.0" class="t t-sans">Referred candidates’ share at each stage (one US firm)</text>
<rect x="190" y="426" width="360" height="34" rx="4" class="f-soft"/>
<rect x="190" y="426" width="73.2" height="34" rx="4" class="f-a2s"/>
<text x="176.0" y="451.0" class="t t-end">applicants</text>
<text x="273.2" y="451.0" class="t t-bold">6.1%</text>
<rect x="190" y="478" width="360" height="34" rx="4" class="f-soft"/>
<rect x="190" y="478" width="256.8" height="34" rx="4" class="f-a2s"/>
<text x="176.0" y="503.0" class="t t-end">interviewed</text>
<text x="456.8" y="503.0" class="t t-bold">21.4%</text>
<rect x="190" y="530" width="360" height="34" rx="4" class="f-soft"/>
<rect x="190" y="530" width="327.6" height="34" rx="4" class="f-a2s"/>
<text x="176.0" y="555.0" class="t t-end">offered</text>
<text x="527.6" y="555.0" class="t t-bold">27.3%</text>
<rect x="190" y="582" width="360" height="34" rx="4" class="f-soft"/>
<rect x="190" y="582" width="349.2" height="34" rx="4" class="f-a2s"/>
<text x="176.0" y="607.0" class="t t-end">hired</text>
<text x="549.2" y="607.0" class="t t-bold">29.1%</text>
<text x="24.0" y="660.0" class="t t-sm t-mute">Bar background = 30%. Sources: Gem 2025 benchmarks (top);</text>
<text x="24.0" y="684.0" class="t t-sm t-mute">Brown, Setren &amp; Topa 2016 (bottom).</text>
</svg>
