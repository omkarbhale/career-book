<text x="30.0" y="40.0" class="t t-lg t-bold">meaningful work goes with...</text>
<text x="30.0" y="96.0" class="t t-bold">large: r = .70 or more</text>
<path d="M30.9 111.2 Q179.4 110.5 329.6 112.4 Q329.8 147.6 329.2 186.7 Q178.6 186.0 30.0 185.8 Q29.2 148.5 29.9 111.9 Z" class="f-a4s k"/>
<text x="350.0" y="136.0" class="t">work engagement,</text>
<text x="350.0" y="162.0" class="t">commitment,</text>
<text x="350.0" y="188.0" class="t">job satisfaction</text>
<text x="30.0" y="236.0" class="t t-bold">moderate to large: r about .44 to .49</text>
<path d="M31.3 253.3 Q122.6 251.3 217.2 252.0 Q218.5 289.0 217.3 325.7 Q123.0 326.8 30.5 326.2 Q30.1 290.3 30.2 251.5 Z" class="f-a4 k"/>
<text x="350.0" y="276.0" class="t">life satisfaction, meaning</text>
<text x="350.0" y="302.0" class="t">in life, general health,</text>
<text x="350.0" y="328.0" class="t">less wish to quit</text>
<text x="30.0" y="376.0" class="t t-bold">small to moderate: up to about .33</text>
<path d="M31.3 392.4 Q85.2 391.6 138.1 392.2 Q138.1 427.7 137.5 465.8 Q82.5 464.5 30.3 466.6 Q30.8 428.7 30.6 391.9 Z" class="f-soft k"/>
<text x="350.0" y="416.0" class="t">helping beyond the role,</text>
<text x="350.0" y="442.0" class="t">self-rated performance,</text>
<text x="350.0" y="468.0" class="t">less bad mood</text>
<path d="M30.0 494.0 Q328.6 493.4 630.5 494.5" class="k-thin k-mute"/>
<text x="30.0" y="522.0" class="t t-sm t-mute">bar length shows the size of the correlation; ranges from one</text>
<text x="30.0" y="546.0" class="t t-sm t-mute">meta-analysis of 44 articles, not individual values;</text>
<text x="30.0" y="570.0" class="t t-sm t-mute">performance is self-rated</text>
