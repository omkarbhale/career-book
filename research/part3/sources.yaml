    also opened.
  secondary_urls: ['https://danielle-li.github.io/assets/docs/PotentialAndTheGenderPromotionGap.pdf', 'https://www.aeaweb.org/articles/materials/24547']
  kind: 'evidence'
  design: 'firm personnel data'
  supports: >-
    Women received higher performance ratings but substantially lower "potential" ratings; potential
    differences explain about half of the gender promotion gap; women later outperformed men with the same
