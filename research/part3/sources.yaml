    baseline). Ratings came from a "Nine Box" performance-potential grid.
  sample: >-
    29,809 management-track employees of a large North American retail chain.
  grade: 'strong'
  caveats: >-
    One retail firm. Circulated as a working paper from 2021 ("Benson, Li & Shue 2021/2022") before
    publication in 2026; the key uses the issue year. Working-paper numbers may differ from the final paper.
  topics: [promotions, regional, reviews]
