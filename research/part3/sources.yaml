# Part III source registry - machine-readable.
#
# Format: same as research/part2/sources.yaml. YAML mapping from a stable citation key to one source
# record. Keys are lowercase first-author family name (ASCII) followed by the year the work is
# conventionally cited by (print/issue year), with a letter suffix when one author has two works in a
# year (bls2026a, bls2026b). Organisations use a short lowercase name (leanin2025, gallup2025). Undated
# web pages use the access year (brown2026). Keys are permanent: never rename one once written.
#
# Fields (all records): type, authors ["Family, Given"], year, title, url, url_checked (date the URL was
# opened), url_note (how it was checked), kind (evidence | review | theory | data | practitioner),
# design, supports, sample, grade (strong | moderate | weak | myth-or-unsupported), caveats,
# topics (Part III research files that cite it; derived automatically).
# Optional: container, volume, issue, pages, doi, secondary_urls,
# flags (commercial | self-interested | practitioner | not-peer-reviewed).
#
# Keys shared with Part I or Part II (bidwell2011) are re-verified here; the README says what changed.
# Grading and method: see research/part3/README.md.
# Generated from verified Crossref/OpenAlex metadata plus hand-written annotations.

