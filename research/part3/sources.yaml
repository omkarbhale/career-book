benson2019:
  type: 'article'
  authors: ['Benson, Alan', 'Li, Danielle', 'Shue, Kelly']
  year: 2019
  title: 'Promotions and the Peter Principle*'
  container: 'The Quarterly Journal of Economics'
  volume: '134'
  issue: '4'
  pages: '2085-2134'
  doi: '10.1093/qje/qjz022'
  url: 'https://doi.org/10.1093/qje/qjz022'
  url_checked: '2026-10-25'
  url_note: >-
    doi.org resolved (HTTP 302); Crossref and OpenAlex metadata fetched; abstract read via OpenAlex. Effect
    sizes read in the NBER working paper w24343 (opened, 2018 version); the published PDF (OUP and MIT
    DSpace) refused automated download (403/429).
  secondary_urls: ['https://www.nber.org/system/files/working_papers/w24343/w24343.pdf']
  kind: 'evidence'
  design: 'firm microdata, promotion and post-promotion performance'
  supports: >-
    Firms promote their best salespeople even though sales performance negatively predicts performance as a
    manager, while collaboration experience (which predicts managerial success) is not rewarded - evidence
    consistent with the Peter Principle; firms weight sales less when the manager role carries more
    responsibility or frontline pay is strongly incentive-based. Working-paper figures: doubling sales
    raises promotion probability by 14.3% relative to the base rate; doubling a new manager's pre-promotion
    sales is associated with a 7.5% fall in each subordinate's sales; "lone wolves" who never collaborated
    did particularly poorly as managers.
  sample: >-
    Sales workers at 131 firms (published version; the 2018 NBER working paper reports 214 firms).
  grade: 'strong'
  caveats: >-
    Sales jobs only, where performance is measurable. Effect sizes come from the working paper and may
    differ in the published version (whose sample is 131 firms). It does not show people rise until they are
    incompetent.
  topics: [promotions, the-fork]
