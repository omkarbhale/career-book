  sample: n/a
  grade: moderate
  caveats: Secondary news report (relays NYT coverage).
  commercial: false
  topics: [networking]

pellizzari-via-brown2016:
  type: note
  authors: [n/a]
  year: 2016
  title: "Pellizzari (2004) as cited in brown2016"
  venue: cited in brown2016 footnote 2
  url: https://resources.newyorkfed.org/medialibrary/media/research/staff_reports/sr568.pdf
  accessed: 2026-10-25
  supports: Between 25% and 40% of respondents in most European countries heard about their current job through informal contacts (European Community Household Panel).
  sample: ECHP households.
  grade: moderate
  caveats: Secondary citation; Pellizzari's original was not opened.
  commercial: false
  topics: [networking, regional]

lester2021:
  type: working-paper
  authors: [Benjamin Lester, David A. Rivers, Giorgio Topa]
  year: 2021
  title: "The heterogeneous impact of referrals on labor market outcomes"
  venue: Federal Reserve Bank of New York Staff Reports, no. 987
  url: https://www.newyorkfed.org/medialibrary/media/research/staff_reports/sr987.pdf
  accessed: 2026-10-25
  supports: Survey literature - most surveys of job seekers find 50-60% report using a referral to find employment; firm surveys range from just under 40% to over 50% of hires via referral. In the NY Fed Survey of Consumer Expectations (2013-2018), business-contact referrals associate with higher starting wages and are used more for high-skill jobs; family/friend referrals with lower starting wages, used more for low-skill jobs.
  sample: SCE Job Search Surveys 2013-2018, nationally representative US online panel.
  grade: strong
  caveats: Working paper; "using a referral" is broad (any contact help).
  commercial: false
  topics: [referrals, networking]

fresnostate2024-hidden:
  type: web
  authors: [College Recruiter, republished by California State University Fresno Career Development Center]
  year: 2024
  title: "Is it true that 80% of job openings are not advertised?"
  venue: Fresno State Career Development Center blog (11 July 2024)
  url: https://careercenter.fresnostate.edu/blog/2024/07/11/is-it-true-that-80-of-job-openings-are-not-advertised/
  accessed: 2026-10-25
  supports: The 80%-unadvertised claim is hard to trace to any single source and "likely originated from anecdotal evidence and informal surveys rather than rigorous, peer-reviewed research."
  sample: n/a
  grade: weak
  caveats: Originally from College Recruiter (a job board); commentary only.
  commercial: true
  topics: [networking, myths]

fernandez1997:
  type: article
  authors: [Roberto M. Fernandez, Nancy Weinberg]
  year: 1997
  title: "Sifting and sorting: Personal contacts and hiring in a retail bank"
  venue: American Sociological Review, 62(6), 883-902
  doi: 10.2307/2657345
  url: https://www.gsb.stanford.edu/faculty-research/working-papers/getting-job-networks-hiring-retail-bank
  url_note: Opened the 1996 Stanford GSB working-paper page ("Getting a job - networks and hiring in a retail bank"), which carries the abstract; the ASR article itself was not opened.
  accessed: 2026-10-25
  supports: Applicants to four job categories at a large retail bank (1993-1995) followed through interview, offer and hire; referrals advantaged at interview and offer stages after controls; referrals present more appropriate resumes, but resume quality and timing do not explain their advantage.
  sample: Applicant pool of one retail bank.
  grade: strong
  caveats: Single firm; evidence taken from the working-paper abstract.
  commercial: false
  topics: [referrals]

pallais2016:
  type: article
  authors: [Amanda Pallais, Emily Glassberg Sands]
  year: 2016
  title: "Why the referential treatment? Evidence from field experiments on referrals"
  venue: Journal of Political Economy (2016); NBER working paper w21357, doi 10.3386/w21357
  url: https://www.nber.org/system/files/working_papers/w21357/w21357.pdf
  url_note: NBER working paper w21357 (July 2015) opened; JPE publication per author's 2016 copyright notice in search results, volume/issue not verified.
  accessed: 2026-10-25
  supports: Three field experiments in an online labour market (oDesk) - referrals carry positive information about performance and persistence beyond observables; referred workers do especially well working directly with their referrer; no evidence of extra effort to protect the referrer.
  sample: Workers hired on oDesk (now Upwork) for experimental tasks.
  grade: strong
  caveats: Online micro-task context; generalisation to salaried jobs is an inference.
  commercial: false
  topics: [referrals]

fernandez2019:
  type: article
  authors: [Roberto M. Fernandez, Brian Rubineau]
  year: 2019
  title: "Network recruitment and the glass ceiling: Evidence from two firms"
  venue: "RSF: The Russell Sage Foundation Journal of the Social Sciences, 5(3), 88-102"
  doi: 10.7758/rsf.2019.5.3.05
  url: https://www.mcgill.ca/desautels/channels/news/network-recruitment-and-glass-ceiling-evidence-two-firms-296396
  url_note: McGill Desautels page carrying the abstract and citation.
  accessed: 2026-10-25
  supports: With gender homophily, referral hiring can disadvantage women where an old-boys network exists, more so at higher levels; but overall network recruitment was desegregating and promoted women's representation at all levels.
  sample: Administrative data from two firms.
  grade: moderate
  caveats: Two firms; abstract-level reading.
  commercial: false
  topics: [referrals]

gee2017:
  type: article
  authors: [Laura K. Gee, Jason Jones, Moira Burke]
  year: 2017
  title: "Social networks and labor markets: How strong ties relate to job finding on Facebook's social network"
  venue: Journal of Labor Economics, 35(2), 485-518
  doi: 10.1086/686225
  url: https://dl.tufts.edu/concern/pdfs/zk51vt87x
