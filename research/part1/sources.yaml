  sample: n/a
  grade: weak
  caveats: Practitioner opinion; uncontroversial but not research.
  commercial: false
  topics: [hiring-funnel]

ladders2012:
  type: industry-report
  authors: [TheLadders (Will Evans)]
  year: 2012
  title: "Keeping an eye on recruiter behavior (Eye tracking online metacognition: cognitive complexity and recruiter decision making)"
  venue: TheLadders (job site)
  url: https://web.archive.org/web/20131214121352/http://cdn.theladders.net/static/images/basicSite/pdfs/TheLadders-EyeTracking-StudyC2.pdf
  url_note: Internet Archive copy of the original PDF.
  accessed: 2026-10-25
  supports: 30 recruiters over 10 weeks; ~6 seconds on initial fit/no-fit decision; ~80% of time on name, titles, companies, dates, education.
  sample: 30 professional recruiters.
  grade: weak
  caveats: Not peer-reviewed; small sample; document promotes TheLadders' resume-rewrite service and compares its own profiles favourably to LinkedIn's.
  commercial: true
  topics: [resumes, hiring-funnel, myths]

ladders2018:
  type: industry-report
  authors: [Ladders Inc.]
  year: 2018
  title: "Eye-Tracking Study 2018"
  venue: Ladders (job site)
  url: https://web.archive.org/web/20210110010358/https://www.theladders.com/static/images/basicSite/pdfs/TheLadders-EyeTracking-StudyC2.pdf
  url_note: Internet Archive copy; live theladders.com blocked automated access (403). Secondary coverage - https://hrdailyadvisor.hci.org/2018/11/15/eye-tracking-recruiters-average-7-4-seconds-reviewing-a-resume/
  accessed: 2026-10-25
  supports: 7.4-second average initial screen; simple layouts with clear titles and headers performed best; clutter, multiple columns, keyword stuffing performed worst.
  sample: Not stated in the report.
  grade: weak
  caveats: Commercial; no sample size or peer review; measures first-pass glance only.
  commercial: true
  topics: [resumes, hiring-funnel, myths]

acs2022-linkedin:
  type: news
  authors: [Information Age (Australian Computer Society)]
  year: 2022
  title: "Secret study conducted on 20 million LinkedIn users"
  venue: Information Age, ACS
  url: https://ia.acs.org.au/article/2022/secret-study-conducted-on-20-million-linkedin-users.html
  accessed: 2026-10-25
