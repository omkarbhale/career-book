# Part II source registry - machine-readable.
#
# Format: YAML mapping from a stable citation key to one source record.
# Keys are lowercase first-author family name (ASCII, no spaces or punctuation)
# followed by the year the work is conventionally cited by (print/issue year),
# with a letter suffix when one author has two works in a year (e.g. mehrabian1967a).
# Keys are permanent: never rename one once written; add a new key instead.
#
# Fields (all records): type, authors ["Family, Given"], year, title, url,
# url_checked (date the URL was opened), url_note (how it was checked),
# kind (evidence | review | theory | data | practitioner),
# design, supports, sample, grade (strong | moderate | weak | myth-or-unsupported),
# caveats, topics (Part II research files that cite it; derived automatically).
# Optional: container, publisher, volume, issue, pages, doi, secondary_urls,
# flags (retracted | commercial | self-interested | practitioner |
#        not-peer-reviewed | coauthor-with-retractions).
#
# Grading and method: see research/part2/README.md.
# Generated from verified Crossref/OpenAlex metadata plus hand-written annotations.

