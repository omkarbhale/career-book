# Sources added for Chapter 17 that are not already in a research registry.
# Same schema as the research registries (see WRITING-GUIDE.md). Each page was opened on the date given.

govuk-working-hours:
  type: government
  authors: ['GOV.UK']
  year: 2026
  title: 'Maximum weekly working hours (Overview; Calculating your working hours; Opting out of the 48 hour week)'
  url: https://www.gov.uk/maximum-weekly-working-hours
  url_checked: '2026-10-25'
  url_note: Read the Overview page plus its subpages /calculating-your-working-hours and /weekly-maximum-working-hours-and-opting-out.
  kind: law
  supports: >-
    "You cannot work more than 48 hours a week on average - normally averaged over 17 weeks."
    The reference period "can be extended to a maximum of 52 weeks if this is agreed" (26 weeks for
    trainee doctors; 52 weeks offshore oil and gas). Counted as work: paid overtime, "unpaid overtime
    you're asked to do", job-related training, working lunches, on-call time at the workplace.
    Opt-out: "You can choose to work more by opting out of the 48-hour week." It "must be voluntary and
    in writing"; you "cannot be sacked or treated unfairly for refusing"; you "can cancel your opt-out
    agreement whenever you want - even if it's part of your employment contract", giving "at least 7
    days' notice" (or "up to 3 months' notice depending on what's in your agreement").
    Under-18s "cannot work more than 8 hours a day or 40 hours a week".
  grade: strong
  caveats: >-
    Official guidance page, not the Working Time Regulations 1998 text (not opened). Some workers
    cannot opt out (airline staff, ships/boats, road transport, others under EU drivers' hours rules,
    security guards on high-value-goods vehicles); some jobs (e.g. 24-hour staffing, armed forces,
    emergency services, police) are exceptions to the 48-hour limit. No last-updated date was visible;
    year is the year accessed.

eu-wtd2003:
  type: government
  authors: ['European Commission, Directorate-General for Employment, Social Affairs and Inclusion']
  year: 2003
  title: Working Time Directive (2003/88/EC)
  url: https://employment-social-affairs.ec.europa.eu/policies-and-activities/rights-work/labour-law/working-conditions/working-time-directive_en
  url_checked: '2026-10-25'
  url_note: Read the Commission's official summary page of Directive 2003/88/EC; the EUR-Lex text itself would not load (bot challenge, empty page).
  kind: law
  supports: >-
    The Directive requires Member States to guarantee: "the average working time for each seven day
    period must not exceed 48 hours, including overtime", averaged "over a reference period of up to 4,
    6 or 12 months" depending on national law/collective agreements; "in every 24 hours a worker is
    entitled to a minimum of 11 consecutive hours of rest"; weekly rest of "a minimum of 24
    uninterrupted hours in addition to the 11 hours' daily rest"; a rest break if on duty longer than
    6 hours; and "paid annual leave of at least 4 weeks per year". Member States "may allow an
    individual worker to opt-out from maximum weekly working time subject to strict conditions",
    including that the worker "should not suffer any detriment if he/she refuses".
    Right to disconnect (status, from the Commission page "Quality jobs for companies and workers in
    Europe", https://employment-social-affairs.ec.europa.eu/policies-and-activities/rights-work/quality-jobs-companies-and-workers-europe_en):
    October 2025, "Two-stage consultation of European social partners on the right to disconnect and
    telework ends"; Dec 2025 - Jan 2026 first-stage consultation on a Quality Jobs Act "explores areas
    such as the right to disconnect"; timeline item "End of 2026: EU law proposal for a Quality Jobs
    Act". The page describes no EU right-to-disconnect law in force.
  grade: strong
  caveats: >-
    Official Commission summary, not the Directive's article text (EUR-Lex blocked automated access, so
    Articles 3, 6, 7 and 16 were not read directly). Derogations exist for specific sectors/categories
    and transport has separate directives. "No EU right-to-disconnect law yet" is what the Commission
    page implies as of 2026-10-25 (only consultations and a planned end-2026 proposal); a proposal may
    have appeared after this check, and some Member States have national rules (not checked).

dol-flsa-hours:
  type: government
  authors: ['U.S. Department of Labor, Wage and Hour Division']
  year: 2026
  title: Wages and the Fair Labor Standards Act; Overtime Pay
  url: https://www.dol.gov/agencies/whd/flsa
  url_checked: '2026-10-25'
  url_note: Read the WHD FLSA overview page and the companion page https://www.dol.gov/agencies/whd/overtime.
  kind: law
  supports: >-
    "There is no limit on the number of hours employees 16 years or older may work in any workweek"
    (overtime page: "There is no limit in the Act on the number of hours employees aged 16 and older may
    work in any workweek"). Covered nonexempt employees "must receive overtime pay for hours worked over
    40 per workweek" at "a rate not less than one and one-half times the regular rate of pay".
  grade: strong
  caveats: >-
    Federal law only; state laws may add daily overtime or other rules (not checked). Exempt employees
    (e.g. under the white-collar exemptions) are not entitled to FLSA overtime; the exemption tests were
    not verified here. No page date shown; year is the year accessed.

india-osh-code:
  type: government
  authors: ['Ministry of Labour and Employment, Government of India', 'Press Information Bureau, Government of India']
  year: 2020
  title: FAQs on Occupational Safety, Health and Working Conditions (OSH) Code, 2020; Additional FAQs on Labour Codes (As on 16.03.2026)
  url: https://www.labour.gov.in/static/uploads/2026/01/fb8c6466d0d6a7ed581bcb2bee34694c.pdf
  url_checked: '2026-10-25'
  url_note: Read the Labour Ministry OSH Code FAQ PDF, the Additional FAQs PDF (https://www.labour.gov.in/static/uploads/2026/03/a4ccf4c6d97c4f1f36a6d83f8c64213d.pdf) and the PIB press release of 21 Nov 2025 (https://www.pib.gov.in/PressReleseDetailm.aspx?PRID=2192463&reg=3&lang=2).
  kind: law
  supports: >-
    PIB: the four Labour Codes, including the OSH Code 2020, "are being made effective from 21st November
    2025, rationalising 29 existing labour laws". Ministry FAQ: "The Code prescribes 8 hours per day and
    48 hours per week as standard, with some flexibility to extend daily hours with the consent of
    workers on payment of overtime, at twice the rate wages." Additional FAQ (16.03.2026): "If, a worker
    works for more than eight hours in any day ... or for more than forty-eight hours in any week ... a
    worker shall in respect of such overtime work be entitled to wages at the rate of twice the normal
    rate of wages". The same FAQ addresses a state-prescribed maximum of 12 hours a day.
  grade: strong
  caveats: >-
    Ministry FAQs and a press release, not the Code's section text: India Code and the e-Gazette would
    not load, so section 25 was not read directly. The limits apply to "workers" as defined in the Code.
    Whether a given office or IT employee is covered (e.g. supervisory/managerial staff) and how state
    Shops and Establishments Acts interact were NOT verified. One FAQ says the Code "will prevail over the
    State Law for provisions which are inconsistent". States notify detailed rules, so daily maxima and
    spread-over can vary by state.
