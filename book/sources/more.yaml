# ------------------------------------------------------- freelancing and founding

camuffo2020:
  type: article
  authors: ['Camuffo, Arnaldo', 'Cordova, Alessandro', 'Gambardella, Alfonso', 'Spina, Chiara']
  year: 2020
  title: 'A Scientific Approach to Entrepreneurial Decision Making: Evidence from a Randomized Control Trial'
  container: Management Science
  volume: '66'
  issue: '2'
  pages: 564-586
  doi: 10.1287/mnsc.2018.3249
  url: https://doi.org/10.1287/mnsc.2018.3249
  url_checked: '2026-10-25'
  url_note: Abstract read via the OpenAlex API (published online 2019, issue 2020). Not flagged as retracted.
  kind: evidence
  design: randomised controlled trial
  supports: >-
    In a trial with 116 Italian startups observed about a year, founders taught to treat their ideas as
    hypotheses and test them rigorously, as scientists do, performed better and were more likely to
    pivot to a different idea than a control group given the same general training, without being more
    likely to drop out early.
  sample: 116 early-stage Italian startups, 16 data points over about a year.
  grade: strong
  caveats: One country and one training programme; early-stage outcomes.

