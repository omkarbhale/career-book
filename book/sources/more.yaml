# Resources recommended in the appendix "Left Out, on Purpose" (book/back/left-out.md).
# Every entry was opened on 2026-10-25, and url_note says exactly what was read. DESIGN.md §13's
# vetting rules apply: each resource exists, is reputable, is worth a reader's time, carries no
# affiliate or tracking links, and is labelled honestly through `kind`.
# Books link to their Open Library work page (a library-neutral catalogue) or the publisher.

# ------------------------------------------------------------------ managing people

hill2019:
  type: book
  authors: ['Hill, Linda A.']
  year: 2019
  title: Becoming a Manager
  container: Harvard Business Review Press
  url: https://openlibrary.org/works/OL20154102W
  url_checked: '2026-10-25'
  url_note: >-
    Open Library work record (Harvard Business Review Press, 2019; ISBN 9781633696969) and the
    publisher's description it carries; an earlier record shows the first edition in 1992 and a second
    edition from Harvard Business School Press. The book itself was not read.
  kind: evidence
  design: qualitative longitudinal study (interviews) of new managers through their first year
  supports: >-
    Follows nineteen new managers through their first year in the role, using interviews, to show what
    the transition from individual performer to manager involves: learning to lead others rather than
    do the work, winning trust and respect, motivating, and balancing delegation and control.
  sample: Nineteen new managers, first year.
  grade: moderate
  caveats: Small qualitative sample; the book was not read in full here, only its description.

fournier2017:
  type: book
  authors: ['Fournier, Camille']
