  url_checked: '2026-10-25'
  url_note: Open Library work record (O'Reilly Media, 2017; ISBN 9781491973899) and the publisher's description.
  kind: practitioner
  design: practitioner guide
  supports: >-
    A practical guide by a tech lead turned CTO through each stage from engineer to technical manager,
    from mentoring interns to working with senior staff, for new managers, mentors and more experienced
    leaders.
  sample: None (the author's experience).
  grade: weak
  caveats: One practitioner's experience; technology industry.
  flags: [practitioner]

zhuo2019:
  type: book
