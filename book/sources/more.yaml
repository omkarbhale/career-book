osc2015:
  type: article
  authors: ['Open Science Collaboration']
  year: 2015
  title: Estimating the reproducibility of psychological science
  container: Science
  volume: '349'
  issue: '6251'
  pages: aac4716
  doi: 10.1126/science.aac4716
  url: https://doi.org/10.1126/science.aac4716
  url_checked: '2026-10-25'
  url_note: Abstract read via the OpenAlex API.
  kind: evidence
  design: large-scale replication project
  supports: >-
    Replications of 100 studies from three psychology journals found effects half the size of the
    originals on average; 97% of original studies had significant results against 36% of replications,
    and replication success was better predicted by the strength of the original evidence than by
    characteristics of the teams.
  sample: 100 replications.
  grade: strong
