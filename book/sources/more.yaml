# -------------------------------------------------------- personality tests and types

barrick1991:
  type: article
  authors: ['Barrick, Murray R.', 'Mount, Michael K.']
  year: 1991
  title: 'The Big Five Personality Dimensions and Job Performance: A Meta-Analysis'
  container: Personnel Psychology
  volume: '44'
  issue: '1'
  pages: 1-26
  doi: 10.1111/j.1744-6570.1991.tb00688.x
  url: https://doi.org/10.1111/j.1744-6570.1991.tb00688.x
  url_checked: '2026-10-25'
  url_note: Abstract read via the OpenAlex API.
  kind: evidence
  design: meta-analysis
  supports: >-
    Of the Big Five personality dimensions, conscientiousness showed consistent relations with all job
    performance criteria across five occupational groups; extraversion predicted performance in
    managerial and sales jobs; other dimensions predicted some criteria in some occupations, with small
    correlations.
  sample: Meta-analysis across five occupational groups and three performance criteria.
  grade: strong
  caveats: >-
    A classic; later re-analyses revised validity estimates for many selection methods
    (see sackett2022 in Part I).

pittenger2005:
  type: article
  authors: ['Pittenger, David J.']
  year: 2005
  title: Cautionary comments regarding the Myers-Briggs Type Indicator
  container: 'Consulting Psychology Journal: Practice and Research'
  volume: '57'
  issue: '3'
  pages: 210-221
  doi: 10.1037/1065-9293.57.3.210
  url: https://doi.org/10.1037/1065-9293.57.3.210
  url_checked: '2026-10-25'
  url_note: Abstract read via the OpenAlex API.
  kind: review
  design: critical review of psychometric evidence
  supports: >-
    Evaluates the psychometric limitations of the Myers-Briggs Type Indicator and concludes that,
    despite its intuitive appeal, it may not support the claims its promoters make, so inferences from
    its four-letter types warrant considerable caution.
  sample: Review.
  grade: moderate
  caveats: A single critical review, written in response to an enthusiastic account of the MBTI's corporate uses.

ipip:
  type: dataset
  authors: ['International Personality Item Pool']
  year: 2026
  title: International Personality Item Pool
  url: https://ipip.ori.org/
  url_checked: '2026-10-25'
  url_note: Official home page and the Big-Five factor markers page opened.
  kind: data
  design: public-domain research instrument
  supports: >-
    The official site of the International Personality Item Pool: over 3,000 items and over 250 scales,
    all in the public domain, including Big-Five factor markers with their reliabilities; launched in
    1998 with an NIMH grant to Lewis R. Goldberg.
  sample: n/a
  grade: strong
  caveats: Research items, not a polished consumer test; scores need interpreting with care.

