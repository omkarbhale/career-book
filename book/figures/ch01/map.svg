<path d="M300.0 869.0 L302.9 876.0 L310.5 876.6 L304.7 881.5 L306.5 888.9 L300.0 885.0 L293.5 888.9 L295.3 881.5 L289.5 876.6 L297.1 876.0 Z" class="f-a3s k-thin"/>
