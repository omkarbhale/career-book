<g transform="rotate(90 530 500.0)"><text x="530.0" y="500.0" class="t-sans t-a2 t-mid">Part II · the long game</text></g>
<circle cx="120" cy="230" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="237.0" class="t t-sm t-bold t-mid">2</text>
<text x="150.0" y="238.0" class="t">Stay or go?</text>
<circle cx="120" cy="314" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="321.0" class="t t-sm t-bold t-mid">3</text>
<text x="150.0" y="322.0" class="t">The other side</text>
<circle cx="120" cy="398" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="405.0" class="t t-sm t-bold t-mid">4</text>
<text x="150.0" y="406.0" class="t">Your evidence</text>
<circle cx="120" cy="482" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="489.0" class="t t-sm t-bold t-mid">5</text>
<text x="150.0" y="490.0" class="t">Paper you</text>
<circle cx="120" cy="566" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="573.0" class="t t-sm t-bold t-mid">6</text>
<text x="150.0" y="574.0" class="t">People</text>
<circle cx="120" cy="650" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="657.0" class="t t-sm t-bold t-mid">7</text>
<text x="150.0" y="658.0" class="t">Interviews</text>
<circle cx="120" cy="734" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="741.0" class="t t-sm t-bold t-mid">8</text>
<text x="150.0" y="742.0" class="t">Show your work</text>
<circle cx="120" cy="818" r="17" class="f-paper k k-a1"/>
<text x="120.0" y="825.0" class="t t-sm t-bold t-mid">9</text>
<text x="150.0" y="826.0" class="t">Offer &amp; exit</text>
<circle cx="480" cy="818" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="825.0" class="t t-sm t-bold t-mid">10</text>
<text x="450.0" y="826.0" class="t t-end">Trust</text>
<circle cx="480" cy="734" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="741.0" class="t t-sm t-bold t-mid">11</text>
<text x="450.0" y="742.0" class="t t-end">First 90 days</text>
<circle cx="480" cy="650" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="657.0" class="t t-sm t-bold t-mid">12</text>
<text x="450.0" y="658.0" class="t t-end">Reliability</text>
<circle cx="480" cy="566" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="573.0" class="t t-sm t-bold t-mid">13</text>
<text x="450.0" y="574.0" class="t t-end">Talk &amp; write</text>
<circle cx="480" cy="482" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="489.0" class="t t-sm t-bold t-mid">14</text>
<text x="450.0" y="490.0" class="t t-end">The dial</text>
<circle cx="480" cy="398" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="405.0" class="t t-sm t-bold t-mid">15</text>
<text x="450.0" y="406.0" class="t t-end">Friends at work</text>
<circle cx="480" cy="314" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="321.0" class="t t-sm t-bold t-mid">16</text>
<text x="450.0" y="322.0" class="t t-end">Conflict</text>
<circle cx="480" cy="230" r="17" class="f-paper k k-a2"/>
<text x="480.0" y="237.0" class="t t-sm t-bold t-mid">17</text>
<text x="450.0" y="238.0" class="t t-end">Growing</text>
<circle cx="200" cy="120" r="22" class="f-a3 k"/>
<text x="200.0" y="128.0" class="t t-bold t-mid">1</text>
<text x="200.0" y="84.0" class="t t-mid">Start: two games</text>
<circle cx="400" cy="120" r="22" class="f-a3 k"/>
<text x="400.0" y="128.0" class="t t-bold t-mid">E</text>
<text x="400.0" y="84.0" class="t t-mid">Epilogue: the loop</text>
