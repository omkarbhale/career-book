<text x="505.0" y="240.0" class="t t-mid">you, every day, for years</text>
<path d="M340.0 268.0 Q339.2 432.1 339.8 596.1" class="k-thin k-dash k-mute"/>
<rect x="250" y="282" width="180" height="26" rx="13" class="f-soft"/>
<text x="340.0" y="300.0" class="t-sans t-mute t-mid">Who judges</text>
<text x="175.0" y="338.0" class="t t-mid t-a1">strangers</text>
<text x="505.0" y="338.0" class="t t-mid t-a2">people who know you</text>
<rect x="250" y="360" width="180" height="26" rx="13" class="f-soft"/>
<text x="340.0" y="378.0" class="t-sans t-mute t-mid">For how long</text>
<text x="175.0" y="416.0" class="t t-mid t-a1">a few hours, over weeks</text>
<text x="505.0" y="416.0" class="t t-mid t-a2">years, every working day</text>
<rect x="250" y="438" width="180" height="26" rx="13" class="f-soft"/>
<text x="340.0" y="456.0" class="t-sans t-mute t-mid">What they see</text>
<text x="175.0" y="494.0" class="t t-mid t-a1">a trailer you edit</text>
<text x="505.0" y="494.0" class="t t-mid t-a2">the whole film, uncut</text>
<rect x="250" y="516" width="180" height="26" rx="13" class="f-soft"/>
<text x="340.0" y="534.0" class="t-sans t-mute t-mid">What wins</text>
<text x="175.0" y="572.0" class="t t-mid t-a1">clear, honest signals</text>
<text x="505.0" y="572.0" class="t t-mid t-a2">being reliably yourself</text>
