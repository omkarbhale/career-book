<text x="530.0" y="176.0" class="t t-mid">do you keep to</text><text x="530.0" y="204.0" class="t t-mid">fair principles?</text>
<text x="530.0" y="254.0" class="t t-sm t-mid t-mute">same you when</text><text x="530.0" y="278.0" class="t t-sm t-mid t-mute">nobody checks</text>
