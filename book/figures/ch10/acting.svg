<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" class="fig">
<title>Surface acting versus deep acting</title>
<style>
/* Figure vocabulary. Every figure's style element is an exact copy of this file
   (python3 tools/build.py --sync-figure-style). Colours come from theme tokens;
   the fallbacks are the light theme, used when a figure is opened on its own. */
.fig { font-family: var(--font-hand, "Caveat", "Segoe Print", "Comic Sans MS", cursive); }
.fig .k { fill: none; stroke: var(--fig-ink, #26211c); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.fig .k-thin { fill: none; stroke: var(--fig-ink, #26211c); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.fig .k-thick { fill: none; stroke: var(--fig-ink, #26211c); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.fig .k-dash { stroke-dasharray: 7 8; }
.fig .k-mute { stroke: var(--fig-ink-2, #6b6156); }
.fig .k-a1 { stroke: var(--fig-a1-strong, #d2552f); }
.fig .k-a2 { stroke: var(--fig-a2-strong, #1f8a7e); }
.fig .k-a3 { stroke: var(--fig-a3-strong, #d9a521); }
.fig .k-a4 { stroke: var(--fig-a4-strong, #7b4fa0); }
.fig .k-paper { stroke: var(--fig-paper, #fbf7ef); }
.fig .f-none { fill: none; }
.fig .f-paper { fill: var(--fig-paper, #fbf7ef); }
.fig .f-soft { fill: var(--fig-soft, #efe6d6); }
.fig .f-ink { fill: var(--fig-ink, #26211c); }
.fig .f-mute { fill: var(--fig-ink-2, #6b6156); }
.fig .f-a1 { fill: var(--fig-a1, #f6c9b6); }
.fig .f-a2 { fill: var(--fig-a2, #b9e3dc); }
.fig .f-a3 { fill: var(--fig-a3, #f9e2a6); }
.fig .f-a4 { fill: var(--fig-a4, #dccbec); }
.fig .f-a1s { fill: var(--fig-a1-strong, #d2552f); }
.fig .f-a2s { fill: var(--fig-a2-strong, #1f8a7e); }
.fig .f-a3s { fill: var(--fig-a3-strong, #d9a521); }
.fig .f-a4s { fill: var(--fig-a4-strong, #7b4fa0); }
.fig .f-skin1 { fill: var(--skin-1, #f2cba8); }
.fig .f-skin2 { fill: var(--skin-2, #d9a27c); }
.fig .f-skin3 { fill: var(--skin-3, #b0724c); }
.fig .f-skin4 { fill: var(--skin-4, #7c4b2f); }
.fig .f-hair1 { fill: var(--hair-1, #2b211c); }
.fig .f-hair2 { fill: var(--hair-2, #6b4a2f); }
.fig .f-hair3 { fill: var(--hair-3, #a7a29b); }
.fig .f-hair4 { fill: var(--hair-4, #7e5bc4); }
.fig .f-dev { fill: var(--c-dev, #e3a92b); }
.fig .f-bea { fill: var(--c-bea, #2f9e7a); }
.fig .f-rex { fill: var(--c-rex, #d94f3d); }
.fig .f-meera { fill: var(--c-meera, #8e3b6b); }
.fig .f-tomas { fill: var(--c-tomas, #3c6fb0); }
.fig .f-kai { fill: var(--c-kai, #8e6fd8); }
.fig .t { fill: var(--fig-ink, #26211c); font-size: 24px; }
.fig .t-sm { font-size: 20px; }
.fig .t-lg { font-size: 30px; }
.fig .t-xl { font-size: 40px; }
.fig .t-sans { font-family: var(--font-ui, "Bricolage Grotesque", system-ui, sans-serif); font-size: 17px; letter-spacing: 0.05em; text-transform: uppercase; font-weight: 700; }
.fig .t-mid { text-anchor: middle; }
.fig .t-end { text-anchor: end; }
.fig .t-bold { font-weight: 700; }
.fig .t-mute { fill: var(--fig-ink-2, #6b6156); }
.fig .t-a1 { fill: var(--fig-a1-ink, #a53d1c); }
.fig .t-a2 { fill: var(--fig-a2-ink, #156b62); }
.fig .t-a4 { fill: var(--fig-a4-ink, #5f3a80); }
.fig .t-paper { fill: var(--fig-paper, #fbf7ef); }
</style>
<text x="160.0" y="38.0" class="t t-sans t-mid t-a1">Surface acting</text>
<text x="480.0" y="38.0" class="t t-sans t-mid t-a2">Deep acting</text>
<path d="M320.0 20.0 Q320.2 245.4 320.4 469.7" class="k-thin k-dash k-mute"/>
<g transform="translate(126 128) scale(1.9)"><circle cx="0" cy="0" r="24" class="f-skin3 k-thin"/><circle cx="-8" cy="-4" r="2" class="f-ink"/><circle cx="8" cy="-4" r="2" class="f-ink"/><path d="M-9 10 Q0 3 9 10" class="k-thin"/></g>
<g transform="translate(176 132) scale(1.7)"><path d="M-26 -18 C-26 -32 26 -32 26 -18 L24 10 C18 28 -18 28 -24 10 Z" class="f-paper k"/><path d="M-14 -8 Q-9 -13 -4 -8 M4 -8 Q9 -13 14 -8" class="k-thin"/><path d="M-13 6 Q0 20 13 6" class="k"/><path d="M26 -2 L44 18" class="k-thin"/><circle cx="46" cy="21" r="5" class="f-skin3 k-thin"/></g>
<text x="160.0" y="236.0" class="t t-mid">inside: annoyed</text><text x="160.0" y="264.0" class="t t-mid">outside: a bright smile</text>
<path d="M52.5 285.3 Q161.3 283.0 268.2 284.2 Q268.0 312.5 268.0 337.9 Q161.4 338.4 51.7 337.7 Q52.0 309.6 52.2 284.4 Z" class="f-a1 k-thin"/>
<text x="160.0" y="319.0" class="t t-mid t-bold">felt ≠ shown</text>
<text x="160.0" y="380.0" class="t t-sm t-mid t-mute">a gap you have to</text><text x="160.0" y="404.0" class="t t-sm t-mid t-mute">hold shut, all day</text>
<text x="160.0" y="438.0" class="t t-a1 t-mid">goes with worse</text><text x="160.0" y="466.0" class="t t-a1 t-mid">well-being</text>
<g transform="translate(440 132) scale(1.9)"><circle cx="0" cy="0" r="24" class="f-skin3 k-thin"/><circle cx="-8" cy="-4" r="2" class="f-ink"/><circle cx="8" cy="-4" r="2" class="f-ink"/><path d="M-8 6 Q0 12 8 6" class="k-thin"/></g>
<path d="M486 92 C486 64 586 60 592 84 C612 86 614 120 592 124 C584 146 500 146 494 124 C474 122 472 96 486 92 Z" class="f-a2 k-thin"/>
<circle cx="482" cy="132" r="5" class="f-a2 k-thin"/><circle cx="472" cy="146" r="3" class="f-a2 k-thin"/>
<text x="540.0" y="100.0" class="t t-sm t-mid">she&#x27;s scared,</text><text x="540.0" y="122.0" class="t t-sm t-mid">not hostile</text>
<text x="480.0" y="236.0" class="t t-mid">you change how you</text><text x="480.0" y="264.0" class="t t-mid">see it, so you feel it</text>
<path d="M371.8 285.1 Q481.4 284.2 588.3 283.4 Q586.6 312.5 587.7 337.5 Q481.3 338.8 371.4 337.7 Q371.2 310.3 371.2 284.0 Z" class="f-a2 k-thin"/>
<text x="480.0" y="319.0" class="t t-mid t-bold">felt ≈ shown</text>
<text x="480.0" y="380.0" class="t t-sm t-mid t-mute">nothing to hold</text><text x="480.0" y="404.0" class="t t-sm t-mid t-mute">shut</text>
<text x="480.0" y="438.0" class="t t-a2 t-mid">weak links</text><text x="480.0" y="466.0" class="t t-a2 t-mid">to strain</text>
<path d="M24.0 482.0 Q319.4 481.7 615.6 481.5" class="k-thin k-mute"/>
<text x="320.0" y="516.0" class="t t-sm t-mid t-mute">Neither is choosing your words or your volume.</text><text x="320.0" y="542.0" class="t t-sm t-mid t-mute">That is register, not acting.</text>
</svg>
