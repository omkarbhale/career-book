<rect x="40" y="268" width="560" height="176" rx="12" class="f-a1"/><path d="M40.7 268.6 Q319.7 267.8 600.7 267.6 Q599.1 356.6 599.6 444.6 Q319.4 445.4 39.8 444.6 Q40.8 356.7 39.5 267.5 Z" class="k"/><text x="60.0" y="298.0" class="t t-sans">EVIDENCE</text><text x="60.0" y="332.0" class="t">Cut the nightly regression run from 6 hours</text><text x="60.0" y="362.0" class="t">to 40 minutes by running suites in parallel;</text><text x="60.0" y="392.0" class="t">the team now tests every merge, and the</text><text x="60.0" y="422.0" class="t">client’s defect reports fell.</text>
<text x="320.0" y="480.0" class="t t-sm t-mid t-mute">Same work. One describes a job; the other describes you.</text>
