<text x="24.0" y="40.0" class="t t-sans t-a1">PART I</text>
<text x="24.0" y="66.0" class="t t-a1">a résumé line</text>
<text x="332.0" y="40.0" class="t t-sans t-a4">PART III</text>
<text x="332.0" y="66.0" class="t t-a4">a promotion-case line</text>
<text x="320.0" y="122.0" class="t t-sans t-mid">SPECIFIC</text>
<rect x="24" y="136" width="284" height="108" rx="10" class="f-a1"/>
<path d="M23.6 135.4 Q165.9 137.4 307.7 135.9 Q308.6 189.6 308.4 244.7 Q165.0 242.9 23.9 244.5 Q25.3 189.5 23.7 136.3 Z" class="k"/>
<text x="40.0" y="170.0" class="t">Cut the test run</text><text x="40.0" y="198.0" class="t">from 6 hours</text><text x="40.0" y="226.0" class="t">to 40 minutes</text>
<rect x="332" y="136" width="284" height="108" rx="10" class="f-a4"/>
<path d="M332.4 137.1 Q473.1 137.6 616.6 135.5 Q615.1 188.9 615.8 243.6 Q473.7 244.7 332.4 244.3 Q330.6 190.3 332.0 135.4 Z" class="k"/>
<text x="348.0" y="170.0" class="t">Made carriers testable</text><text x="348.0" y="198.0" class="t">for 3 squads: live in</text><text x="348.0" y="226.0" class="t">2 weeks, not 6</text>
<text x="320.0" y="282.0" class="t t-sans t-mid">CHECKABLE</text>
<rect x="24" y="296" width="284" height="108" rx="10" class="f-a1"/>
<path d="M24.5 295.8 Q166.2 296.5 307.3 295.9 Q308.2 350.6 307.9 404.0 Q165.2 404.1 24.3 403.4 Q24.1 351.5 23.8 296.2 Z" class="k"/>
<text x="40.0" y="330.0" class="t">Ask me how I</text><text x="40.0" y="358.0" class="t">parallelised it</text>
<rect x="332" y="296" width="284" height="108" rx="10" class="f-a4"/>
<path d="M331.2 295.0 Q472.9 297.2 615.7 296.8 Q614.8 350.2 615.7 404.0 Q473.5 404.0 332.3 403.3 Q330.5 349.2 331.9 295.9 Z" class="k"/>
<text x="348.0" y="330.0" class="t">The harness, the</text><text x="348.0" y="358.0" class="t">dashboards, and two</text><text x="348.0" y="386.0" class="t">squad leads who use it</text>
<text x="320.0" y="442.0" class="t t-sans t-mid">COSTLY TO FAKE</text>
<rect x="24" y="456" width="284" height="108" rx="10" class="f-a1"/>
<path d="M25.0 456.4 Q164.8 456.7 308.4 456.0 Q308.8 509.8 307.9 563.3 Q167.4 564.6 24.2 564.0 Q24.4 509.2 23.9 455.9 Z" class="k"/>
<text x="40.0" y="490.0" class="t">Only the person who</text><text x="40.0" y="518.0" class="t">did it survives the</text><text x="40.0" y="546.0" class="t">follow-up</text>
<rect x="332" y="456" width="284" height="108" rx="10" class="f-a4"/>
<path d="M332.4 457.1 Q473.8 454.9 615.7 455.7 Q614.9 509.7 616.2 564.6 Q474.3 563.7 332.0 564.5 Q330.7 509.8 332.6 456.4 Z" class="k"/>
<text x="348.0" y="490.0" class="t">Work beyond my squad</text><text x="348.0" y="518.0" class="t">that others now</text><text x="348.0" y="546.0" class="t">depend on</text>
<rect x="120" y="588" width="400" height="44" rx="22" class="f-a3"/>
<path d="M120.4 588.8 Q319.6 587.5 519.8 587.5 Q520.0 609.3 520.3 632.2 Q321.0 633.6 120.4 632.0 Q120.1 610.4 120.6 587.3 Z" class="k-thin"/>
<text x="320.0" y="618.0" class="t t-bold t-mid">Same rules. Different audience.</text>
</svg>
