<text x="24.0" y="40.0" class="t t-sans">What Tomás has seen, two years</text>
<rect x="24" y="58" width="592" height="230" rx="8" class="f-paper"/>
<path d="M24.2 59.2 Q320.8 59.5 616.1 58.0 Q615.1 172.4 616.7 288.1 Q321.6 289.4 23.5 287.5 Q25.1 173.0 23.6 57.7 Z" class="k"/>
<rect x="44" y="80" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="97.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="98.0" class="t">warned me early, every time since Northwind</text>
<rect x="44" y="120" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="137.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="138.0" class="t">found the race condition on a Saturday</text>
<rect x="44" y="160" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="177.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="178.0" class="t">stopped a bad release, with evidence</text>
<rect x="44" y="200" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="217.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="218.0" class="t">harness now used by three squads</text>
<rect x="44" y="240" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="257.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="258.0" class="t">fixed the credit record, calmly</text>
<path d="M320.0 300.0 Q319.5 332.2 320.0 362.0" class="k-thick k-a4"/><path d="M320.0 362.0 L325.5 351.3 M320.0 362.0 L314.2 351.5" class="k-thick k-a4"/>
<text x="340.0" y="340.0" class="t t-a4">spent in the room</text>
<g transform="translate(50.0 382.0) scale(1.312)"><defs><clipPath id="tomasledger"><circle cx="32" cy="32" r="30.5"/></clipPath></defs><circle cx="32" cy="32" r="30.5" class="f-soft"/><g clip-path="url(#tomasledger)"><path d="M27 40.5 L27 49 L37 49 L37 40.5 Z" class="f-skin2 k-thin"/><path d="M7 68 C8 54 17 48.5 32 48.5 C47 48.5 56 54 57 68 Z" class="f-tomas k-thin"/><path d="M25.2 48.6 L29.2 53.6 L32 49.4 L34.8 53.6 L38.8 48.6" class="k-thin"/><path d="M14 58 L50 58" class="k-thin k-paper"/><path d="M22 52 L21 66 M42 52 L43 66" class="k-thin k-paper"/><ellipse cx="19.8" cy="31.5" rx="2.3" ry="3.3" class="f-skin2 k-thin"/><ellipse cx="44.2" cy="31.5" rx="2.3" ry="3.3" class="f-skin2 k-thin"/><ellipse cx="32" cy="30" rx="12.4" ry="14" class="f-skin2 k-thin"/><path d="M20 27.4 C19.4 17.4 25.6 14.2 32 14.2 C38.4 14.2 44.6 17.4 44 27.4 C42 21.6 38 19.6 32 19.6 C26 19.6 22 21.6 20 27.4 Z" class="f-hair1 k-thin"/><path d="M20.4 32.6 C20.8 42.8 26.8 46.6 32 46.6 C37.2 46.6 43.2 42.8 43.6 32.6 C41.4 37.8 37.2 39.4 32 39.4 C26.8 39.4 22.6 37.8 20.4 32.6 Z" class="f-hair1 k-thin"/><circle cx="27.4" cy="30.4" r="1.6" class="f-ink"/><circle cx="36.6" cy="30.4" r="1.6" class="f-ink"/><path d="M24.6 26 Q27.4 25 30.2 26" class="k-thin"/><path d="M33.8 26 Q36.6 25 39.4 26" class="k-thin"/><path d="M32.2 31.5 Q31 34.4 32.8 34.8" class="k-thin"/><ellipse cx="32" cy="40.6" rx="3.4" ry="1.3" class="f-skin2"/></g><circle cx="32" cy="32" r="30.5" class="k-thin"/></g>
<path d="M150 414 L176 406 L176 388 Q176 378 186 378 L606 378 Q616 378 616 388 L616 436 Q616 446 606 446 L186 446 Q176 446 176 436 L176 424 Z" class="f-a4 k-thin"/>
<text x="396.0" y="420.0" class="t t-mid">“I’ll stake my judgement on this.”</text>
<text x="24.0" y="494.0" class="t t-sans">Tomás’s own ledger with the committee</text>
<rect x="44" y="516" width="22" height="22" rx="4" class="f-a2s"/>
<text x="55.0" y="533.0" class="t t-bold t-mid t-paper">+</text>
<text x="80.0" y="534.0" class="t">if he’s right: his judgement gains credit</text>
<rect x="44" y="556" width="22" height="22" rx="4" class="f-a1s"/>
<text x="55.0" y="573.0" class="t t-bold t-mid t-paper">−</text>
<text x="80.0" y="574.0" class="t t-a1">if he’s wrong: his withdrawal, not hers</text>
<text x="320.0" y="624.0" class="t t-sm t-mid t-mute">Illustrative, not a formula.</text>
</svg>
