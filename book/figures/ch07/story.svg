.fig .t-a2 { fill: var(--fig-a2-ink, #156b62); }
.fig .t-a4 { fill: var(--fig-a4-ink, #5f3a80); }
.fig .t-paper { fill: var(--fig-paper, #fbf7ef); }
</style>
<text x="30.0" y="34.0" class="t t-sans">A two-minute answer, roughly to scale</text>
<path d="M29.4 52.4 Q76.8 53.5 127.2 52.8 Q125.9 79.0 126.0 107.5 Q76.8 108.6 29.8 108.5 Q30.8 79.5 29.5 51.8 Z" class="f-soft k"/>
<circle cx="78.33333333333334" cy="80" r="15" class="f-paper k-thin"/><text x="78.3" y="87.0" class="t t-mid t-bold">1</text>
<path d="M125.2 52.5 Q294.8 50.9 465.6 51.9 Q466.4 81.5 465.3 107.6 Q294.7 107.2 127.0 108.0 Q126.0 78.5 126.4 51.8 Z" class="f-a1 k"/>
<circle cx="295.8333333333333" cy="80" r="15" class="f-paper k-thin"/><text x="295.8" y="87.0" class="t t-mid t-bold">2</text>
<path d="M463.6 51.2 Q512.7 51.7 561.7 52.1 Q562.8 79.3 561.0 107.7 Q512.4 108.2 465.0 107.7 Q463.7 80.8 465.2 52.2 Z" class="f-a3 k"/>
<circle cx="513.3333333333334" cy="80" r="15" class="f-paper k-thin"/><text x="513.3" y="87.0" class="t t-mid t-bold">3</text>
<path d="M562.3 53.1 Q584.3 51.0 610.0 52.3 Q610.0 80.0 609.7 107.6 Q587.0 109.5 561.7 107.9 Q560.5 80.3 561.2 52.2 Z" class="f-a2 k"/>
<circle cx="585.8333333333333" cy="80" r="15" class="f-paper k-thin"/><text x="585.8" y="87.0" class="t t-mid t-bold">4</text>
<text x="30.0" y="136.0" class="t t-sm t-mute">0</text>
<text x="610.0" y="136.0" class="t t-sm t-mute t-end">2 minutes</text>
<path d="M29.3 167.9 Q44.2 167.4 56.1 167.7 Q56.0 182.2 56.0 194.7 Q42.7 193.9 30.2 194.0 Q30.6 180.3 29.2 167.9 Z" class="f-soft k-thin"/>
<text x="43.0" y="188.0" class="t t-sm t-mid t-bold">1</text>
<text x="74.0" y="190.0" class="t t-sans">situation and task · about 20 seconds</text>
<text x="74.0" y="224.0" class="t">the queue was dropping 1 in 2,000</text><text x="74.0" y="254.0" class="t">messages; nobody had spotted it</text>
<path d="M28.6 289.2 Q43.3 290.6 56.7 290.3 Q56.2 302.5 56.0 315.7 Q41.7 316.1 30.2 315.7 Q30.8 303.1 29.7 290.6 Z" class="f-a1 k-thin"/>
<text x="43.0" y="310.0" class="t t-sm t-mid t-bold">2</text>
<text x="74.0" y="312.0" class="t t-sans">what I did · about 70 seconds</text>
<text x="74.0" y="346.0" class="t">noticed a pattern in the test logs, wrote</text><text x="74.0" y="376.0" class="t">a reproduction, paired with the developer</text><text x="74.0" y="406.0" class="t">on the fix, added a nightly test</text>
<path d="M28.5 441.3 Q42.4 442.6 55.6 442.8 Q54.7 454.8 56.0 468.4 Q42.2 466.9 30.4 468.5 Q30.2 456.3 29.8 441.9 Z" class="f-a3 k-thin"/>
<text x="43.0" y="462.0" class="t t-sm t-mid t-bold">3</text>
<text x="74.0" y="464.0" class="t t-sans">result · about 20 seconds</text>
<text x="74.0" y="498.0" class="t">fixed three days before the client&#x27;s</text><text x="74.0" y="528.0" class="t">launch; no repeats in a year</text>
<path d="M30.0 562.8 Q44.0 562.6 55.3 564.7 Q55.8 575.9 56.6 589.5 Q42.9 588.4 29.4 590.0 Q30.6 575.8 30.4 564.2 Z" class="f-a2 k-thin"/>
<text x="43.0" y="584.0" class="t t-sm t-mid t-bold">4</text>
<text x="74.0" y="586.0" class="t t-sans">what I&#x27;d keep · about 10 seconds</text>
<text x="74.0" y="620.0" class="t">now I check retries first</text>
<text x="30.0" y="684.0" class="t t-sm t-mute">a rule of thumb, not a finding:</text><text x="30.0" y="710.0" class="t t-sm t-mute">most of the time goes on what you did</text>
</svg>
