<text x="419.0" y="223.0" class="t t-mid">5</text>
<path d="M377.5 233.0 Q372.1 240.3 363.1 241.9 Q354.3 244.3 345.7 241.3 Q337.6 237.2 334.1 228.6 Q328.3 221.5 328.2 212.4 Q329.9 203.4 336.6 197.1 Q341.9 189.7 351.0 188.8 Q359.7 185.7 368.2 188.9 Q376.4 192.8 380.1 201.2 Q385.7 208.5 386.4 217.7 Q384.1 226.6 378.5 233.8" class="k k-a1"/>
<text x="70.0" y="284.0" class="t t-bold">1 =</text>
<text x="112.0" y="284.0" class="t">vague, or someone else did it</text>
<text x="70.0" y="328.0" class="t t-bold">3 =</text>
<text x="112.0" y="328.0" class="t">clear problem, own action,</text><text x="112.0" y="356.0" class="t">some result</text>
<text x="70.0" y="400.0" class="t t-bold">5 =</text>
<text x="112.0" y="400.0" class="t">noticed early, acted, checked,</text><text x="112.0" y="428.0" class="t">and stopped it recurring</text>
<text x="70.0" y="462.0" class="t t-sans">evidence heard</text>
<path d="M62.7 474.2 Q266.2 475.1 468.1 473.4 Q468.5 541.6 467.6 606.3 Q263.8 607.0 62.1 606.1 Q62.3 540.1 62.3 474.2 Z" class="k-thin k-dash k-mute"/>
<text x="80.0" y="508.0" class="t t-a2">queue bug, 2 days before go-live</text><text x="80.0" y="540.0" class="t t-a2">wrote a repro, paired on the fix</text><text x="80.0" y="572.0" class="t t-a2">added a nightly test</text>
<text x="265.0" y="640.0" class="t t-mid t-bold t-a1">score alone, then discuss</text>
<g transform="translate(552 548) scale(2.4)"><path d="M0 0 L2 22 L20 22 L22 0 Z" class="f-meera k-thin"/><path d="M22 5 C31 5 31 16 21 16" class="k-thin"/><path d="M6 -4 Q8 -9 6 -14 M14 -4 Q16 -9 14 -14" class="k-thin k-mute"/></g>
<text x="578.0" y="636.0" class="t t-sans t-mid">structure</text>
<text x="578.0" y="658.0" class="t t-sans t-mid">is kindness</text>
</svg>
