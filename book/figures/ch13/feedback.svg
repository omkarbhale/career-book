<circle cx="320" cy="270" r="7" class="f-ink"/>
<text x="40.0" y="310.0" class="t t-bold t-a2">at the task</text>
<text x="600.0" y="310.0" class="t t-bold t-a1 t-end">at the self</text>
<path d="M22.8 328.8 Q166.6 328.7 308.8 329.6 Q309.2 406.5 307.3 479.8 Q166.0 479.1 23.6 479.8 Q23.9 404.3 24.2 330.1 Z" class="f-a2 k-thin"/>
<text x="40.0" y="366.0" class="t t-sm">“The decision is in</text><text x="40.0" y="392.0" class="t t-sm">paragraph six. Put it</text><text x="40.0" y="418.0" class="t t-sm">in the first line.”</text>
<text x="40.0" y="460.0" class="t t-bold t-a2">tends to help</text>
<path d="M332.2 328.5 Q475.3 329.7 615.8 329.5 Q615.3 405.3 615.9 480.7 Q473.9 479.6 332.5 480.5 Q333.5 406.1 332.1 330.5 Z" class="f-a1 k-thin"/>
<text x="348.0" y="366.0" class="t t-sm">“You’re not a very</text><text x="348.0" y="392.0" class="t t-sm">clear writer, are</text><text x="348.0" y="418.0" class="t t-sm">you?”</text>
<text x="348.0" y="460.0" class="t t-bold t-a1">tends to backfire</text>
