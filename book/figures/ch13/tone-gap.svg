<text x="115.0" y="62.0" class="t t-sm t-mid">(said with a grin,</text><text x="115.0" y="86.0" class="t t-sm t-mid">obviously joking)</text>
<path d="M440 30 h170 a18 18 0 0 1 18 18 v44 a18 18 0 0 1 -18 18 h-42 v20 l-18 -20 h-110 a18 18 0 0 1 -18 -18 v-44 a18 18 0 0 1 18 -18 z" class="f-a1 k-thin"/>
<text x="525.0" y="62.0" class="t t-sm t-mid">...is she annoyed</text><text x="525.0" y="86.0" class="t t-sm t-mid">with me?</text>
<path d="M195.7 139.7 Q321.3 141.3 443.7 140.6 Q445.5 173.1 443.2 204.8 Q319.2 205.0 195.5 204.1 Q195.7 172.6 196.4 140.6 Z" class="f-paper k"/>
<text x="320.0" y="180.0" class="t t-sm t-mid">“Oh great, another meeting.”</text>
<path d="M150.0 172.0 Q172.1 173.2 192.0 172.0" class="k"/><path d="M192.0 172.0 L182.9 167.8 M192.0 172.0 L183.5 177.2" class="k"/>
<path d="M448.0 172.0 Q469.4 172.1 490.0 172.0" class="k"/><path d="M490.0 172.0 L481.1 167.3 M490.0 172.0 L481.2 176.7" class="k"/>
<text x="90.0" y="266.0" class="t t-sm t-mid">what you hear</text><text x="90.0" y="290.0" class="t t-sm t-mid">when you reread it</text>
<text x="320.0" y="236.0" class="t t-sm t-mid t-mute">what actually</text><text x="320.0" y="260.0" class="t t-sm t-mid t-mute">travels: the words</text>
<text x="550.0" y="266.0" class="t t-sm t-mid">what they get:</text><text x="550.0" y="290.0" class="t t-sm t-mid">their own guess</text>
<path d="M24.0 318.0 Q320.9 318.4 616.4 317.8" class="k-thin k-mute"/>
<text x="320.0" y="354.0" class="t t-sm t-mid">Senders overestimate how well tone comes across in writing,</text><text x="320.0" y="380.0" class="t t-sm t-mid">because they hear their own voice when they reread it.</text>
