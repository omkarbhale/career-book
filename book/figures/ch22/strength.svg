<path d="M19.5 59.8 Q159.7 60.1 300.0 60.3 Q300.9 225.1 300.3 390.4 Q160.4 391.5 20.3 390.7 Q18.8 224.5 19.8 59.8 Z" class="f-a1 k"/>
<text x="160.0" y="40.0" class="t t-sans t-mid t-a1">the first time (chapter 1)</text>
<text x="40.0" y="104.0" class="t">47 applications,</text>
<text x="40.0" y="130.0" class="t t-sm t-mute">46 noes</text>
<text x="40.0" y="170.0" class="t">a résumé of duties</text>
<text x="40.0" y="196.0" class="t t-sm t-mute"></text>
<text x="40.0" y="236.0" class="t">nobody inside</text>
<text x="40.0" y="262.0" class="t t-sm t-mute">to vouch for her</text>
<path d="M38.6 330.6 Q160.8 331.5 279.8 330.5 Q281.0 352.2 279.6 373.5 Q161.0 372.8 40.5 374.0 Q38.6 351.5 40.1 330.5 Z" class="f-paper k-thin"/>
<text x="160.0" y="360.0" class="t t-bold t-mid">any yes looks like rescue</text>
<path d="M379.6 60.7 Q521.1 60.2 659.4 59.7 Q660.8 225.0 660.1 390.6 Q519.9 391.3 379.2 390.2 Q379.1 223.6 379.4 60.2 Z" class="f-a4 k"/>
<text x="520.0" y="40.0" class="t t-sans t-mid t-a4">this time</text>
<text x="400.0" y="104.0" class="t">one call,</text>
<text x="400.0" y="130.0" class="t t-sm t-mute">and it came to her</text>
<text x="400.0" y="170.0" class="t">a Wins log and</text>
<text x="400.0" y="196.0" class="t t-sm t-mute">a story bank</text>
<text x="400.0" y="236.0" class="t">people who will vouch,</text>
<text x="400.0" y="262.0" class="t t-sm t-mute">inside and out</text>
<path d="M401.3 329.8 Q521.6 328.4 639.4 329.7 Q639.3 351.7 639.5 374.4 Q519.2 372.4 400.1 373.4 Q398.7 352.9 400.2 329.8 Z" class="f-paper k-thin"/>
<text x="520.0" y="360.0" class="t t-bold t-mid">she can say no</text>
