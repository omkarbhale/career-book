<text x="40.0" y="184.0" class="t t-bold">your line,</text>
<text x="40.0" y="210.0" class="t t-bold">set in advance</text>
<text x="640.0" y="100.0" class="t t-sm t-end t-mute">each step makes</text>
<text x="640.0" y="122.0" class="t t-sm t-end t-mute">the next one feel normal</text>
<text x="300.0" y="178.0" class="t t-bold t-mid">1</text>
<text x="390.0" y="238.0" class="t t-bold t-mid">2</text>
<text x="490.0" y="298.0" class="t t-bold t-mid">3</text>
<text x="590.0" y="358.0" class="t t-bold t-mid t-a1">4</text>
<path d="M24.0 410.0 Q332.6 408.7 640.2 410.4" class="k-thin k-dash k-mute"/>
<text x="40.0" y="452.0" class="t">1. skip one test, just this once</text>
<text x="40.0" y="492.0" class="t">2. report amber as green: “it&#x27;s basically fine”</text>
<text x="40.0" y="532.0" class="t">3. call a real failure flaky</text>
<text x="40.0" y="572.0" class="t t-a1">4. the client&#x27;s numbers are wrong, and they don&#x27;t know</text>
