<text x="320.0" y="32.0" class="t t-sans t-mid">The commitment loop</text>
<path d="M22.7 94.3 Q161.7 95.3 300.2 94.0 Q301.4 155.3 300.6 217.9 Q162.6 219.5 24.5 218.2 Q25.0 154.5 23.9 94.6 Z" class="f-soft k"/>
<text x="40.0" y="130.0" class="t t-bold">1 · Hear the ask</text>
<text x="40.0" y="166.0" class="t t-sm">what do they</text><text x="40.0" y="192.0" class="t t-sm">actually need?</text>
<path d="M24.8 253.8 Q161.1 253.5 299.9 253.4 Q301.4 316.5 300.0 377.5 Q161.4 377.7 23.4 377.7 Q23.6 316.8 24.7 253.2 Z" class="f-soft k"/>
<text x="40.0" y="290.0" class="t t-bold">2 · Clarify</text>
<text x="40.0" y="326.0" class="t t-sm">what, by when, and</text><text x="40.0" y="352.0" class="t t-sm">what does done mean?</text>
<path d="M22.8 415.1 Q160.4 413.2 300.1 414.1 Q299.1 476.8 300.3 537.2 Q162.7 537.6 24.0 538.1 Q24.5 477.0 23.5 413.5 Z" class="f-a3 k"/>
<text x="40.0" y="450.0" class="t t-bold">3 · Say it out loud</text>
<text x="40.0" y="486.0" class="t t-sm">“Rates by Thursday,</text><text x="40.0" y="512.0" class="t t-sm">tested, in staging.”</text>
<path d="M339.1 413.0 Q478.9 415.2 615.8 414.3 Q616.9 477.2 616.4 538.1 Q479.0 537.4 340.2 537.6 Q339.7 475.6 340.0 413.2 Z" class="f-soft k"/>
<text x="356.0" y="450.0" class="t t-bold">4 · Track it</text>
<text x="356.0" y="486.0" class="t t-sm">somewhere you will</text><text x="356.0" y="512.0" class="t t-sm">see it tomorrow</text>
<path d="M339.8 254.0 Q479.3 254.7 615.4 253.8 Q616.8 314.7 616.6 377.3 Q478.6 378.2 340.7 377.8 Q339.4 315.0 339.6 253.7 Z" class="f-a2 k"/>
<text x="356.0" y="290.0" class="t t-bold">5 · Deliver, or</text>
<text x="356.0" y="326.0" class="t t-sm">renegotiate early,</text><text x="356.0" y="352.0" class="t t-sm">the day you know</text>
<path d="M340.3 93.3 Q477.0 95.2 615.3 94.7 Q615.2 156.8 616.4 218.7 Q478.9 216.4 340.4 218.8 Q340.9 156.1 339.3 93.2 Z" class="f-soft k"/>
<text x="356.0" y="130.0" class="t t-bold">6 · Close the loop</text>
<text x="356.0" y="166.0" class="t t-sm">tell them it’s done;</text><text x="356.0" y="192.0" class="t t-sm">don’t make them ask</text>
<path d="M162.0 220.0 Q161.2 235.7 162.0 250.0" class="k"/><path d="M162.0 250.0 L166.2 240.9 M162.0 250.0 L156.8 241.5" class="k"/>
<path d="M162.0 380.0 Q160.9 395.2 162.0 410.0" class="k"/><path d="M162.0 410.0 L166.0 400.8 M162.0 410.0 L156.7 401.5" class="k"/>
