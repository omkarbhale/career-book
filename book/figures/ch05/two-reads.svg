<text x="225.2" y="346.0" class="t t-sans">THE FULL READ</text>
<text x="225.2" y="376.0" class="t t-sm t-mute">minutes, if you pass</text>
<text x="225.2" y="424.0" class="t t-bold">Is it true, and is it them?</text>
<text x="225.2" y="468.0" class="t">looks at: what changed, by</text><text x="225.2" y="496.0" class="t">how much; what to ask about</text>
