<text x="225.2" y="58.0" class="t t-sans t-a1">THE FIRST GLANCE</text>
<text x="225.2" y="88.0" class="t t-sm t-mute">seconds, for everyone</text>
<text x="225.2" y="136.0" class="t t-bold">Is this plausibly a fit?</text>
<text x="225.2" y="180.0" class="t">looks at: titles, employers,</text><text x="225.2" y="208.0" class="t">dates, education</text>
<path d="M110.6 276.0 Q112.1 290.6 110.6 308.0" class="k"/><path d="M110.6 308.0 L117.1 297.9 M110.6 308.0 L105.9 297.0" class="k"/>
