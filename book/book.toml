# The book's spine: metadata, reading order, parts and cast.
# Chapter files are found by id: book/chapters/ch07-anything.md is chapter ch07.
# A chapter with no file yet is published as a plan ("In production").

[book]
title = "Three Games, One You"
subtitle = "A field guide to landing the job, being yourself at work, and making the work count"
blurb = "Getting a job, working with people, and being good at the work so that it counts are three different games with different rules. This book teaches all three, one evidence-graded chapter at a time, and argues that the winning move in each is the same: be one real person, and make that person easy to see."
language = "en"
site_url = "https://omkarbhale.github.io/career-book/"
repo_url = "https://github.com/omkarbhale/career-book"
copyright = "© 2026 Omkar Bhale"
cover = "front/cover.svg"
cover_alt = "Dev, the book's protagonist, stands among three games. On the left, an instant photo labelled 'the snapshot' holds a résumé, next to a stopwatch. On the right, a film strip labelled 'the long game' runs off the page, its frames showing a coffee mug, speech bubbles, a checklist and a handshake. Below it, a short staircase rises to a gold star, labelled 'the career game'."

[bibliography]
# Every registry matched here is read. A key may repeat across files only for the same work.
files = ["research/*/sources.yaml", "book/sources/*.yaml"]

