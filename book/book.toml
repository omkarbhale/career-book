# The book's spine: metadata, reading order, parts and cast.
# Chapter files are found by id: book/chapters/ch07-anything.md is chapter ch07.
# A chapter with no file yet is published as a plan ("In production").

[book]
title = "Two Games, One You"
subtitle = "A field guide to landing the job and being yourself at work"
blurb = "Getting a job and doing a job are different games with different rules. This book teaches both, one evidence-graded chapter at a time, and argues that the winning move in each is the same: be one real person, and make that person easy to see."
language = "en"
site_url = "https://omkarbhale.github.io/career-book/"
repo_url = "https://github.com/omkarbhale/career-book"
copyright = "© 2026 Omkar Bhale"
cover = "front/cover.svg"
cover_alt = "Dev, the book's protagonist, stands between two game boards. On the left, a single photo frame labelled 'the snapshot' holds a résumé and a stopwatch. On the right, a long film strip labelled 'the long game' winds off the page, its frames showing small everyday moments at work."

[bibliography]
# Every registry matched here is read. A key may repeat across files only for the same work.
files = ["research/*/sources.yaml", "book/sources/*.yaml"]

